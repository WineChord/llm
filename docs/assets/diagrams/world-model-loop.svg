<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">世界模型闭环</title>
  <desc id="desc">观察编码成状态，动力学模型在动作条件下想象未来，规划器比较候选并执行动作，环境返回新观察。</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.ink{fill:#172033}.muted{fill:#5b6577}.card{fill:#f8f9fb;stroke:#cbd1da}.blue{fill:#eaf2ff;stroke:#79a1dc}.amber{fill:#fff5df;stroke:#d7a84b}.green{fill:#e9f7f0;stroke:#6eaa89}.rose{fill:#fff0f2;stroke:#d78b98}.line{stroke:#657084;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#8791a2;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}text{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:29px;font-weight:600}.t{font-size:21px;font-weight:600}.s{font-size:17px}.xs{font-size:15px}@media(prefers-color-scheme:dark){.bg{fill:#111318}.ink{fill:#edf0f6}.muted{fill:#b9c0ce}.card{fill:#191d25;stroke:#454d5b}.blue{fill:#182941;stroke:#6e98d5}.amber{fill:#302616;stroke:#c79a46}.green{fill:#172a22;stroke:#68a783}.rose{fill:#321e23;stroke:#cd7e8c}.line,.dash{stroke:#9da6b5}}}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#657084"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="ink h" x="60" y="62">世界模型的检验发生在闭环</text>
  <text class="muted s" x="60" y="94">预测漂亮未来并不充分；动作反事实、规划增益与误差恢复才连接到决策</text>
  <rect class="blue" x="70" y="238" rx="14" width="210" height="122"/><text class="ink t" x="175" y="281" text-anchor="middle">观察</text><text class="muted xs" x="175" y="311" text-anchor="middle">image · state · history</text><text class="muted xs" x="175" y="336" text-anchor="middle">timestamp · uncertainty</text>
  <rect class="card" x="350" y="238" rx="14" width="210" height="122"/><text class="ink t" x="455" y="281" text-anchor="middle">状态表示</text><text class="muted xs" x="455" y="311" text-anchor="middle">pixel / token / latent</text><text class="muted xs" x="455" y="336" text-anchor="middle">decision-sufficient?</text>
  <rect class="amber" x="650" y="148" rx="14" width="230" height="122"/><text class="ink t" x="765" y="190" text-anchor="middle">动力学</text><text class="muted xs" x="765" y="220" text-anchor="middle">p(s′, r | s, a)</text><text class="muted xs" x="765" y="245" text-anchor="middle">rollout · uncertainty</text>
  <rect class="green" x="650" y="352" rx="14" width="230" height="122"/><text class="ink t" x="765" y="394" text-anchor="middle">规划 / 策略</text><text class="muted xs" x="765" y="424" text-anchor="middle">CEM · MCTS · actor</text><text class="muted xs" x="765" y="449" text-anchor="middle">goal · value · constraint</text>
  <rect class="rose" x="950" y="238" rx="14" width="190" height="122"/><text class="ink t" x="1045" y="281" text-anchor="middle">环境</text><text class="muted xs" x="1045" y="311" text-anchor="middle">execute aₜ</text><text class="muted xs" x="1045" y="336" text-anchor="middle">return oₜ₊₁</text>
  <path class="line" d="M280 299H334"/><path class="line" d="M560 279C596 255 612 228 634 216"/><path class="line" d="M765 270V336"/><path class="line" d="M880 413C920 399 926 350 941 329"/><path class="line" d="M950 274C917 178 889 157 880 195"/>
  <path class="line" d="M1045 360V572H175V378"/>
  <text class="ink s" x="593" y="557" text-anchor="middle">真实反馈纠正模型：重新观察、重规划、恢复</text>
  <rect class="card" x="350" y="496" rx="12" width="210" height="82"/><text class="ink s" x="455" y="528" text-anchor="middle">训练目标</text><text class="muted xs" x="455" y="553" text-anchor="middle">reconstruction / feature / value</text>
  <path class="dash" d="M455 480V376"/><path class="dash" d="M560 537C642 529 696 502 728 478"/>
  <text class="muted xs" x="600" y="650" text-anchor="middle">评价轴：单步预测 · 多步一致性 · 动作反事实 · 不确定性 · model exploitation · 下游闭环增益</text>
</svg>
