<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">多模态计算图</title>
  <desc id="desc">图像、音频、视频与机器人状态经过采样和表示，进入共享语义、生成与世界模型，再输出语言、媒体或动作。</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.ink{fill:#172033}.muted{fill:#5b6577}.line{stroke:#8791a2}.card{fill:#f7f8fa;stroke:#cbd1da}.blue{fill:#eaf2ff;stroke:#7da4df}.amber{fill:#fff5df;stroke:#d7a94e}.green{fill:#eaf7f0;stroke:#72ab8c}.rose{fill:#fff0f2;stroke:#d78b98}.arrow{stroke:#657084;stroke-width:2;fill:none;marker-end:url(#arrow)}text{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:29px;font-weight:600}.t{font-size:22px;font-weight:600}.s{font-size:17px}.xs{font-size:15px}@media(prefers-color-scheme:dark){.bg{fill:#111318}.ink{fill:#edf0f6}.muted{fill:#b9c0ce}.card{fill:#191d25;stroke:#454d5b}.blue{fill:#182941;stroke:#6e98d5}.amber{fill:#302616;stroke:#c79a46}.green{fill:#172a22;stroke:#68a783}.rose{fill:#321e23;stroke:#cd7e8c}.line{stroke:#667080}.arrow{stroke:#9da6b5}}}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#657084"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="ink h" x="60" y="64">连续世界如何进入模型，又怎样回到世界</text>
  <text class="muted s" x="60" y="96">统一序列只是中间接口；采样、可逆性、时间与动作仍保留各自契约</text>
  <text class="muted xs" x="74" y="145">输入信号</text>
  <rect class="blue" x="60" y="164" rx="12" width="190" height="78"/><text class="ink t" x="155" y="197" text-anchor="middle">图像</text><text class="muted xs" x="155" y="223" text-anchor="middle">像素 · 深度 · 文档</text>
  <rect class="amber" x="60" y="260" rx="12" width="190" height="78"/><text class="ink t" x="155" y="293" text-anchor="middle">音频</text><text class="muted xs" x="155" y="319" text-anchor="middle">波形 · 频谱 · 声源</text>
  <rect class="green" x="60" y="356" rx="12" width="190" height="78"/><text class="ink t" x="155" y="389" text-anchor="middle">视频</text><text class="muted xs" x="155" y="415" text-anchor="middle">帧 · 运动 · 音画</text>
  <rect class="rose" x="60" y="452" rx="12" width="190" height="78"/><text class="ink t" x="155" y="485" text-anchor="middle">身体与环境</text><text class="muted xs" x="155" y="511" text-anchor="middle">状态 · 触觉 · 动作</text>
  <text class="muted xs" x="345" y="145">模态接口</text>
  <rect class="card" x="320" y="164" rx="14" width="235" height="366"/>
  <text class="ink t" x="438" y="205" text-anchor="middle">采样与表示</text>
  <line class="line" x1="350" y1="224" x2="525" y2="224"/>
  <text class="ink s" x="350" y="264">空间：resize / patch</text>
  <text class="ink s" x="350" y="304">声音：STFT / codec</text>
  <text class="ink s" x="350" y="344">视频：frame / tubelet</text>
  <text class="ink s" x="350" y="384">动作：frame / unit</text>
  <text class="ink s" x="350" y="435">连续 latent 或离散 token</text>
  <text class="muted xs" x="350" y="474">位置 · segment · timestamp</text>
  <text class="muted xs" x="350" y="502">mask · rate · provenance</text>
  <path class="arrow" d="M250 347 H305"/>
  <text class="muted xs" x="640" y="145">共享计算</text>
  <rect class="blue" x="620" y="164" rx="12" width="240" height="94"/><text class="ink t" x="740" y="201" text-anchor="middle">语义与推理</text><text class="muted xs" x="740" y="230" text-anchor="middle">对齐 · grounding · memory</text>
  <rect class="amber" x="620" y="282" rx="12" width="240" height="94"/><text class="ink t" x="740" y="319" text-anchor="middle">生成与编辑</text><text class="muted xs" x="740" y="348" text-anchor="middle">AR · diffusion · flow</text>
  <rect class="green" x="620" y="400" rx="12" width="240" height="130"/><text class="ink t" x="740" y="437" text-anchor="middle">世界模型与策略</text><text class="muted xs" x="740" y="466" text-anchor="middle">state · dynamics · value</text><text class="muted xs" x="740" y="494" text-anchor="middle">planning · closed loop</text>
  <path class="arrow" d="M555 347 H603"/>
  <text class="muted xs" x="961" y="145">输出协议</text>
  <rect class="card" x="930" y="164" rx="12" width="210" height="78"/><text class="ink t" x="1035" y="197" text-anchor="middle">语言与结构</text><text class="muted xs" x="1035" y="223" text-anchor="middle">text · box · timeline</text>
  <rect class="card" x="930" y="282" rx="12" width="210" height="94"/><text class="ink t" x="1035" y="319" text-anchor="middle">媒体</text><text class="muted xs" x="1035" y="348" text-anchor="middle">image · audio · video</text>
  <rect class="card" x="930" y="400" rx="12" width="210" height="130"/><text class="ink t" x="1035" y="437" text-anchor="middle">动作</text><text class="muted xs" x="1035" y="466" text-anchor="middle">chunk · trajectory</text><text class="muted xs" x="1035" y="494" text-anchor="middle">controller command</text>
  <path class="arrow" d="M860 211 H914"/><path class="arrow" d="M860 329 H914"/><path class="arrow" d="M860 465 H914"/>
  <path class="arrow" d="M1035 548 V606 H155 V548"/>
  <text class="ink s" x="595" y="642" text-anchor="middle">闭环系统还要把输出后的新观察、延迟、失败与安全约束送回状态</text>
  <text class="muted xs" x="595" y="674" text-anchor="middle">能力边界由整条链路的最窄接口决定，而不是由模型标签决定</text>
</svg>
