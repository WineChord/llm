<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">具身控制栈</title>
  <desc id="desc">目标和多传感器观察经过语义规划、VLA策略、运行时安全监督与低层控制器形成机器人动作，并闭环返回观察。</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.ink{fill:#172033}.muted{fill:#5b6577}.card{fill:#f8f9fb;stroke:#cbd1da}.blue{fill:#eaf2ff;stroke:#79a1dc}.amber{fill:#fff5df;stroke:#d7a84b}.green{fill:#e9f7f0;stroke:#6eaa89}.rose{fill:#fff0f2;stroke:#d78b98}.line{stroke:#657084;stroke-width:2.2;fill:none;marker-end:url(#a)}.feedback{stroke:#8791a2;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}text{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:29px;font-weight:600}.t{font-size:21px;font-weight:600}.s{font-size:17px}.xs{font-size:15px}@media(prefers-color-scheme:dark){.bg{fill:#111318}.ink{fill:#edf0f6}.muted{fill:#b9c0ce}.card{fill:#191d25;stroke:#454d5b}.blue{fill:#182941;stroke:#6e98d5}.amber{fill:#302616;stroke:#c79a46}.green{fill:#172a22;stroke:#68a783}.rose{fill:#321e23;stroke:#cd7e8c}.line,.feedback{stroke:#9da6b5}}}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#657084"/></marker></defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="ink h" x="60" y="62">具身模型位于控制栈中，而不是控制栈本身</text>
  <text class="muted s" x="60" y="94">语义泛化、动作生成、实时执行与物理安全属于不同责任层</text>
  <rect class="blue" x="65" y="150" rx="14" width="220" height="112"/><text class="ink t" x="175" y="189" text-anchor="middle">目标与观察</text><text class="muted xs" x="175" y="219" text-anchor="middle">language · vision · state</text><text class="muted xs" x="175" y="244" text-anchor="middle">touch · calibration · time</text>
  <rect class="card" x="350" y="150" rx="14" width="220" height="112"/><text class="ink t" x="460" y="189" text-anchor="middle">语义规划</text><text class="muted xs" x="460" y="219" text-anchor="middle">task decomposition</text><text class="muted xs" x="460" y="244" text-anchor="middle">affordance · permission</text>
  <rect class="amber" x="635" y="150" rx="14" width="220" height="112"/><text class="ink t" x="745" y="189" text-anchor="middle">VLA / 策略</text><text class="muted xs" x="745" y="219" text-anchor="middle">token · diffusion · flow</text><text class="muted xs" x="745" y="244" text-anchor="middle">action chunk · uncertainty</text>
  <rect class="rose" x="920" y="150" rx="14" width="220" height="112"/><text class="ink t" x="1030" y="189" text-anchor="middle">运行时监督</text><text class="muted xs" x="1030" y="219" text-anchor="middle">workspace · collision · stale</text><text class="muted xs" x="1030" y="244" text-anchor="middle">watchdog · E-stop</text>
  <path class="line" d="M285 206H334"/><path class="line" d="M570 206H619"/><path class="line" d="M855 206H904"/>
  <rect class="green" x="920" y="346" rx="14" width="220" height="112"/><text class="ink t" x="1030" y="385" text-anchor="middle">低层控制器</text><text class="muted xs" x="1030" y="415" text-anchor="middle">interpolation · feedback</text><text class="muted xs" x="1030" y="440" text-anchor="middle">force · joint · trajectory</text>
  <rect class="card" x="635" y="346" rx="14" width="220" height="112"/><text class="ink t" x="745" y="385" text-anchor="middle">机器人与环境</text><text class="muted xs" x="745" y="415" text-anchor="middle">contact · latency · failure</text><text class="muted xs" x="745" y="440" text-anchor="middle">new observation</text>
  <path class="line" d="M1030 262V330"/><path class="line" d="M920 402H871"/>
  <path class="feedback" d="M635 402H175V278"/>
  <rect class="card" x="65" y="538" rx="14" width="1075" height="124"/>
  <text class="ink t" x="95" y="578">一条可执行 action contract</text>
  <text class="ink s" x="95" y="610">type: absolute / delta / velocity</text>
  <text class="ink s" x="430" y="610">frame: world / base / end-effector</text>
  <text class="ink s" x="817" y="610">unit · rate · timestamp</text>
  <text class="muted xs" x="95" y="641">normalization · calibration · gripper semantics · execution horizon · timeout · cancellation · constraint</text>
  <text class="muted xs" x="600" y="721" text-anchor="middle">闭环评测同时记录任务进展、恢复、干预、碰撞、约束违反、端到端延迟与 unsafe success</text>
</svg>
