name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check content
        run: python scripts/check_content.py
      - name: Check paper figures
        run: python scripts/check_paper_figures.py
      - name: Check knowledge architecture
        run: python scripts/check_architecture.py
      - name: Check Python snippets
        run: python scripts/check_python.py
      - name: Check hand-written references
        run: python scripts/check_snippets.py
      - name: Check canonical code integration
        run: python scripts/check_code_integration.py
      - name: Check Markdown and mathematics
        run: python scripts/check_rendering.py
      - name: Build site
        run: mkdocs build --strict
      - name: Check rendered paper figures
        run: python scripts/check_paper_figures.py --site-dir site
      - name: Check rendered links and fragments
        run: python scripts/check_links.py --site-dir site
      - name: Check rendered code integration
        run: python scripts/check_code_integration.py --site-dir site
      - name: Check generated and browser rendering
        run: >-
          python scripts/check_rendering.py --site-dir site --browser
          --visual-artifacts-dir visual-audit
      - name: Upload visual audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: visual-audit
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
